spring:
  datasource:
    # Em produção, as credenciais vêm de variáveis de ambiente — NUNCA hardcode!
    # Configure no sistema operacional, Docker, Kubernetes secrets, etc.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      expiration-minutes: ${APP_SECURITY_JWT_EXPIRATION_MINUTES:60}

logging:
  level:
    root: WARN
    com.materiais.instrucionais: INFO
