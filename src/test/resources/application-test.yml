spring:
  jpa:
    hibernate:
      # validate: o Hibernate verifica o schema mas não modifica nada.
      # O Flyway cria as tabelas via migrações antes dos testes iniciarem.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # Testcontainers + @ServiceConnection configura automaticamente a URL do banco.
    # O Flyway executa as migrações no container PostgreSQL antes dos testes.
    locations: classpath:db/migration

app:
  security:
    jwt:
      # 44-char Base64 = 32 decoded bytes = valid 256-bit HS256 key — test only
      secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      expiration-minutes: 60

logging:
  level:
    com.materiais.instrucionais: DEBUG
