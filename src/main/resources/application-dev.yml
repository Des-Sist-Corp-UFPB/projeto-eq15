spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/materiais_dev
    username: materiais
    password: materiais123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # validate: o Hibernate verifica se o schema do banco bate com as entidades,
      # mas NÃO modifica nada. O Flyway é responsável por criar/alterar as tabelas.
      # NUNCA use create-drop em produção — apaga todos os dados!
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # Localização dos scripts de migração SQL
    locations: classpath:db/migration

app:
  security:
    jwt:
      # Base64-encoded 256-bit secret — override via APP_SECURITY_JWT_SECRET env var in dev
      secret: ${APP_SECURITY_JWT_SECRET:ZGV2LXNlY3JldC1rZXktZm9yLWRldi1vbmx5LW5vdC1mb3ItcHJvZHVjdGlvbiE=}
      expiration-minutes: ${APP_SECURITY_JWT_EXPIRATION_MINUTES:60}

logging:
  level:
    com.materiais.instrucionais: DEBUG
    org.springframework.web: DEBUG
