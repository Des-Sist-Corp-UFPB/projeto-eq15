services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_BLOCK_DURATION_SECONDS: ${LOGIN_BLOCK_DURATION_SECONDS:-900}
      MINIO_ENDPOINT:   ${MINIO_ENDPOINT}
      MINIO_PORT:       ${MINIO_PORT:-9000}
      MINIO_USE_SSL:    ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET:     ${MINIO_BUCKET:-materiais-instrucionais}
      MI_MAX_FILE_SIZE_MB: ${MI_MAX_FILE_SIZE_MB:-50}
      APP_URL:          ${APP_URL}
      EMAIL_VERIFICATION_EXPIRES_HOURS: ${EMAIL_VERIFICATION_EXPIRES_HOURS:-24}
      SMTP_HOST:        ${SMTP_HOST}
      SMTP_PORT:        ${SMTP_PORT}
      SMTP_SECURE:      ${SMTP_SECURE:-false}
      SMTP_USER:        ${SMTP_USER}
      SMTP_PASS:        ${SMTP_PASS}
      SMTP_FROM:        ${SMTP_FROM:-MI UFPB <noreply@dcx.ufpb.br>}
    extra_hosts:
      # Permite que o container acesse o PostgreSQL rodando no host (porta 8115)
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
