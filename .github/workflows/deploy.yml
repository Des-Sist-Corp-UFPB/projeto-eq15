name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/projeto-eq15-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/projeto-eq15-web

jobs:
  # ─────────────────────────────────────────────
  # 1. Build das imagens Docker e push para GHCR
  # ─────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — API (MI-server)
        uses: docker/build-push-action@v6
        with:
          context: ./MI-server
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push — Web (front)
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 2. Deploy no servidor via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose.prod.yml para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH || '/opt/eq15' }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Secrets repassados como variáveis de ambiente para o script remoto
          DATABASE_URL:    ${{ secrets.DB_URL }}
          DB_USERNAME:     ${{ secrets.DB_USERNAME }}
          DB_PASSWORD:     ${{ secrets.DB_PASSWORD }}
          JWT_SECRET:      ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL:     ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD:  ${{ secrets.ADMIN_PASSWORD }}
          # MinIO (armazenamento de PDFs)
          MINIO_ENDPOINT:  ${{ secrets.MINIO_ENDPOINT }}
          MINIO_PORT:      ${{ secrets.MINIO_PORT }}
          MINIO_USE_SSL:   ${{ secrets.MINIO_USE_SSL }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET:    ${{ secrets.MINIO_BUCKET }}
          # Frontend URL (CORS + link do e-mail de verificação)
          APP_URL:         ${{ secrets.APP_URL }}
          # SMTP (opcional — sem config, link é impresso no console)
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:     ${{ secrets.SMTP_SECURE }}
          SMTP_USER:       ${{ secrets.SMTP_USER }}
          SMTP_PASS:       ${{ secrets.SMTP_PASS }}
          SMTP_FROM:       ${{ secrets.SMTP_FROM }}
          GHCR_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          ACTOR:           ${{ github.actor }}
          SHA:             ${{ github.sha }}
          REPO_OWNER:      ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: DATABASE_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,ADMIN_EMAIL,ADMIN_PASSWORD,MINIO_ENDPOINT,MINIO_PORT,MINIO_USE_SSL,MINIO_ACCESS_KEY,MINIO_SECRET_KEY,MINIO_BUCKET,APP_URL,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,SMTP_FROM,GHCR_TOKEN,ACTOR,SHA,REPO_OWNER
          script: |
            set -e

            DEPLOY_PATH="${DEPLOY_PATH:-/opt/eq15}"
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # DB_URL esperado: postgresql://usuario:senha@host.docker.internal:8115/eq15
            FINAL_DB_URL="${DATABASE_URL}"

            # Escreve o arquivo .env para o docker compose
            cat > .env <<EOF
            DATABASE_URL=${FINAL_DB_URL}
            JWT_SECRET=${JWT_SECRET}
            JWT_ACCESS_EXPIRES_IN=15m
            JWT_REFRESH_EXPIRES_IN=7d
            BCRYPT_SALT_ROUNDS=12
            ADMIN_EMAIL=${ADMIN_EMAIL}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}
            LOGIN_MAX_ATTEMPTS=5
            LOGIN_BLOCK_DURATION_SECONDS=900
            MINIO_ENDPOINT=${MINIO_ENDPOINT}
            MINIO_PORT=${MINIO_PORT:-9000}
            MINIO_USE_SSL=${MINIO_USE_SSL:-false}
            MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
            MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
            MINIO_BUCKET=${MINIO_BUCKET:-materiais-instrucionais}
            APP_URL=${APP_URL}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_SECURE=${SMTP_SECURE:-false}
            SMTP_USER=${SMTP_USER}
            SMTP_PASS=${SMTP_PASS}
            SMTP_FROM=${SMTP_FROM}
            API_IMAGE=ghcr.io/${REPO_OWNER}/projeto-eq15-api:${SHA}
            WEB_IMAGE=ghcr.io/${REPO_OWNER}/projeto-eq15-web:${SHA}
            EOF

            # Autentica no GHCR para poder fazer pull das imagens privadas
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

            # Pull das novas imagens
            docker pull ghcr.io/${REPO_OWNER}/projeto-eq15-api:${SHA}
            docker pull ghcr.io/${REPO_OWNER}/projeto-eq15-web:${SHA}

            # Sobe os serviços (sem recriar o redis se já estiver saudável)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Executa migrations do Prisma
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy

            # Remove imagens antigas para liberar espaço
            docker image prune -f

            echo "Deploy concluído: ${SHA}"
