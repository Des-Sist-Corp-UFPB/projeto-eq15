name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepara nome da imagem (lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Escreve .env no servidor
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_ENV_KEY }}" > ~/.ssh/env_key
          chmod 600 ~/.ssh/env_key
          printf 'JWT_SECRET=%s\nADMIN_EMAIL=%s\nADMIN_PASSWORD=%s\n' \
            "${{ secrets.JWT_SECRET }}" \
            "${{ secrets.ADMIN_EMAIL }}" \
            "${{ secrets.ADMIN_PASSWORD }}" | \
          ssh -i ~/.ssh/env_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.SSH_USERNAME }}@dsc.rodrigor.com" \
              "mkdir -p ~/app && cat > ~/app/.env"

      - name: Deploy no servidor
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USERNAME }}@dsc.rodrigor.com" \
            "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
