name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────
  # 1. Build das imagens Docker e push para GHCR
  # ─────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image names
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_API=ghcr.io/${OWNER}/projeto-eq15-api" >> $GITHUB_ENV
          echo "IMAGE_WEB=ghcr.io/${OWNER}/projeto-eq15-web" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — API (MI-server)
        uses: docker/build-push-action@v6
        with:
          context: ./MI-server
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push — Web (front)
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 2. Deploy no servidor via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Copiar docker-compose.prod.yml para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          port: 22
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH || '/opt/eq15' }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Secrets repassados como variáveis de ambiente para o script remoto
          DATABASE_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO_OWNER: ${{ env.OWNER_LC }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          port: 22
          envs: DATABASE_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,ADMIN_EMAIL,ADMIN_PASSWORD,GHCR_TOKEN,ACTOR,SHA,REPO_OWNER
          script: |
            set -e

            DEPLOY_PATH="${DEPLOY_PATH:-/opt/eq15}"
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # Monta DATABASE_URL no formato Prisma caso DB_URL não esteja configurada
            # DB_URL esperado: postgresql://usuario:senha@host.docker.internal:8115/eq15
            FINAL_DB_URL="${DATABASE_URL}"

            # Escreve o arquivo .env para o docker compose
            cat > .env <<EOF
            DATABASE_URL=${FINAL_DB_URL}
            JWT_SECRET=${JWT_SECRET}
            JWT_ACCESS_EXPIRES_IN=15m
            JWT_REFRESH_EXPIRES_IN=7d
            BCRYPT_SALT_ROUNDS=12
            ADMIN_EMAIL=${ADMIN_EMAIL}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}
            LOGIN_MAX_ATTEMPTS=5
            LOGIN_BLOCK_DURATION_SECONDS=900
            API_IMAGE=ghcr.io/${REPO_OWNER}/projeto-eq15-api:${SHA}
            WEB_IMAGE=ghcr.io/${REPO_OWNER}/projeto-eq15-web:${SHA}
            EOF

            # Autentica no GHCR para poder fazer pull das imagens privadas
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

            # Pull das novas imagens
            docker pull ghcr.io/${REPO_OWNER}/projeto-eq15-api:${SHA}
            docker pull ghcr.io/${REPO_OWNER}/projeto-eq15-web:${SHA}

            # Sobe os serviços (sem recriar o redis se já estiver saudável)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Executa migrations do Prisma
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy

            # Remove imagens antigas para liberar espaço
            docker image prune -f

            echo "Deploy concluído: ${SHA}"
