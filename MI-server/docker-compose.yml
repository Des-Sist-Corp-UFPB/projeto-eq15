# docker-compose.yml — ambiente de desenvolvimento local
#
# Pré-requisito: crie o arquivo .env na raiz de MI-server/ com:
#   JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD, LOGIN_MAX_ATTEMPTS etc.
#   (copie de .env.test.example e ajuste os valores)
#
# Subir tudo:        docker compose up --build
# Apenas infra:      docker compose up db minio redis
# Ver logs da API:   docker compose logs -f api
# Rodar seed:        docker compose exec api npx prisma db seed
# Console MinIO:     http://localhost:9001  (minioadmin / minioadmin)

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: mi-postgres
    environment:
      POSTGRES_DB:       mi_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mi_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── MinIO (armazenamento de PDFs) ───────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: mi-minio
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API  →  usado pela aplicação
      - "9001:9001"   # Console web  →  http://localhost:9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Redis (jobs assíncronos / BullMQ — futuro) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── Migrations (one-shot) ───────────────────────────────────────────────────
  # Roda `prisma migrate deploy` e sai.
  # A API só sobe após este serviço concluir com sucesso.
  migrate:
    build:
      context: .
      target: migrate        # usa o stage builder (tem a CLI do Prisma)
    container_name: mi-migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mi_db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    container_name: mi-server
    # Carrega segredos do .env local (JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD…)
    env_file:
      - .env
    environment:
      # Sobrescreve as variáveis de infraestrutura do .env com os hostnames
      # internos do Docker Compose.
      DATABASE_URL:    postgresql://postgres:postgres@db:5432/mi_db
      MINIO_ENDPOINT:  minio
      MINIO_PORT:      "9000"
      MINIO_USE_SSL:   "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET:    materiais-instrucionais
    ports:
      - "3333:3333"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
